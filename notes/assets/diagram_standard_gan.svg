<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #1e293b; stroke-width: 1.2; rx: 5px; }
      .decision-box { fill: #f8fafc; stroke: #1e293b; stroke-width: 1.2; rx: 5px; }
      .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4 3; rx: 6px; }
      .group-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #475569; letter-spacing: 0.5px; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .node-subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #64748b; text-anchor: middle; }
      .edge { stroke: #1e293b; stroke-width: 1.2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Subgraph 1: Generation -->
  <rect x="16" y="16" width="356" height="258" class="group"/>
  <text x="32" y="38" class="group-label">1. GENERATION (SENTEZ)</text>

  <!-- Node: Latent Vector z -->
  <rect x="36" y="126" width="144" height="58" class="box"/>
  <text x="108" y="150" class="node-text">Latent Vector (z)</text>
  <text x="108" y="167" class="node-subtext">Random Noise</text>

  <!-- Arrow z -> G -->
  <line x1="180" y1="155" x2="218" y2="155" class="edge" marker-end="url(#arrow)"/>

  <!-- Node: Generator G -->
  <rect x="220" y="126" width="136" height="58" class="box"/>
  <text x="288" y="150" class="node-text">Generator (G)</text>
  <text x="288" y="167" class="node-subtext">Artist Network</text>

  <!-- Arrow G -> Synthetic Face -->
  <line x1="356" y1="155" x2="416" y2="155" class="edge" marker-end="url(#arrow)"/>

  <!-- Subgraph 2: Discrimination -->
  <rect x="398" y="16" width="406" height="258" class="group"/>
  <text x="414" y="38" class="group-label">2. DISCRIMINATION (DENETİM)</text>

  <!-- Node: Real Face -->
  <rect x="418" y="54" width="144" height="58" class="box"/>
  <text x="490" y="78" class="node-text">Real Face (y)</text>
  <text x="490" y="95" class="node-subtext">Ground Truth</text>

  <!-- Node: Synthetic Face -->
  <rect x="418" y="126" width="144" height="58" class="box"/>
  <text x="490" y="150" class="node-text">Synthetic Face</text>
  <text x="490" y="167" class="node-subtext">G(z)</text>

  <!-- Node: Discriminator D -->
  <rect x="630" y="126" width="154" height="58" class="box"/>
  <text x="707" y="150" class="node-text">Discriminator (D)</text>
  <text x="707" y="167" class="node-subtext">Critic Network</text>

  <!-- Node: Decision -->
  <rect x="630" y="198" width="154" height="58" class="decision-box"/>
  <text x="707" y="222" class="node-text">Decision</text>
  <text x="707" y="239" class="node-subtext">Real or Fake (0 to 1)</text>

  <!-- Arrows to Discriminator -->
  <path d="M 562 83 L 707 83 L 707 124" class="edge" marker-end="url(#arrow)"/>
  <line x1="562" y1="155" x2="628" y2="155" class="edge" marker-end="url(#arrow)"/>

  <!-- Arrow D -> Decision -->
  <line x1="707" y1="184" x2="707" y2="196" class="edge" marker-end="url(#arrow)"/>
</svg>
