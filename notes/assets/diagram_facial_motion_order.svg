<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #1e293b; stroke-width: 1.2; rx: 5px; }
      .leaf-box { fill: #f8fafc; stroke: #475569; stroke-width: 1.2; rx: 5px; }
      .group { fill: #fafafa; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4 3; rx: 6px; }
      .group-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #475569; letter-spacing: 0.5px; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .node-subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #64748b; text-anchor: middle; }
      .edge { stroke: #1e293b; stroke-width: 1.2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Subgraph container -->
  <rect x="16" y="16" width="748" height="250" class="group"/>
  <text x="32" y="38" class="group-label">FACIAL MOTION REPRESENTATION (YÜZ HAREKET MODELLERİ)</text>

  <!-- Root: Keypoint -->
  <rect x="36" y="105" width="140" height="58" class="box"/>
  <text x="106" y="129" class="node-text">Keypoint</text>
  <text x="106" y="146" class="node-subtext">Coordinate (x, y)</text>

  <!-- 0th-Order Branch -->
  <rect x="236" y="54" width="254" height="58" class="box"/>
  <text x="363" y="78" class="node-text">0th-Order: Translation Only</text>
  <text x="363" y="95" class="node-subtext">Sadece Sağa-Sola Kayma (x, y)</text>

  <!-- 1st-Order Branch -->
  <rect x="236" y="156" width="254" height="58" class="box"/>
  <text x="363" y="180" class="node-text">1st-Order (FOMM): Deformation</text>
  <text x="363" y="197" class="node-subtext">Jacobian Matrisi J (Taylor Açılımı)</text>

  <!-- Edges from Root -->
  <path d="M 176 124 L 206 124 L 206 83 L 234 83" class="edge" marker-end="url(#arrow)"/>
  <path d="M 176 144 L 206 144 L 206 185 L 234 185" class="edge" marker-end="url(#arrow)"/>

  <!-- Sub-components of 1st-Order -->
  <!-- Rotation -->
  <rect x="545" y="120" width="195" height="38" class="leaf-box"/>
  <text x="642" y="144" class="node-text">Rotation (Dönme)</text>

  <!-- Scale -->
  <rect x="545" y="166" width="195" height="38" class="leaf-box"/>
  <text x="642" y="190" class="node-text">Scale (Büyüme/Küçülme)</text>

  <!-- Shear -->
  <rect x="545" y="212" width="195" height="38" class="leaf-box"/>
  <text x="642" y="236" class="node-text">Shear (Yamulma/Gerilme)</text>

  <!-- Edges to sub-components -->
  <path d="M 490 185 L 518 185 L 518 139 L 543 139" class="edge" marker-end="url(#arrow)"/>
  <line x1="490" y1="185" x2="543" y2="185" class="edge" marker-end="url(#arrow)"/>
  <path d="M 490 185 L 518 185 L 518 231 L 543 231" class="edge" marker-end="url(#arrow)"/>
</svg>
