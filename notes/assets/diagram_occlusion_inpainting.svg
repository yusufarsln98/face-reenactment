<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 280" width="100%" height="100%">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #1e293b; stroke-width: 1.2; rx: 4px; }
      .final-box { fill: #ffffff; stroke: #0f172a; stroke-width: 1.8; rx: 4px; }
      .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 4 3; rx: 6px; }
      .group-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #475569; letter-spacing: 0.5px; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .node-subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 400; fill: #64748b; text-anchor: middle; }
      .edge { stroke: #1e293b; stroke-width: 1.2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Subgraph 1: Detection -->
  <rect x="20" y="20" width="230" height="240" class="group"/>
  <text x="35" y="44" class="group-label">1. DETECTION (TESPİT)</text>

  <!-- Node: Occlusion Mask -->
  <rect x="35" y="111" width="200" height="58" class="box"/>
  <text x="135" y="133" class="node-text">Occlusion Mask (O)</text>
  <text x="135" y="151" class="node-subtext">Missing / Occluded Regions</text>

  <!-- Subgraph 2: Synthesis (Generator) -->
  <rect x="275" y="20" width="480" height="240" class="group"/>
  <text x="295" y="44" class="group-label">2. SYNTHESIS / GENERATOR (SENTEZ)</text>

  <!-- Node: Face Prior / Latent Memory -->
  <rect x="295" y="55" width="235" height="58" class="box"/>
  <text x="412.5" y="77" class="node-text">Face Prior / Latent Memory</text>
  <text x="412.5" y="95" class="node-subtext">Dataset Teeth &amp; Ear Distribution</text>

  <!-- Node: Source Subject Context -->
  <rect x="295" y="167" width="235" height="58" class="box"/>
  <text x="412.5" y="189" class="node-text">Source Subject Context</text>
  <text x="412.5" y="207" class="node-subtext">Skin Tone, Jawline, Lighting</text>

  <!-- Node: Inpainting Layers -->
  <rect x="585" y="111" width="150" height="58" class="box"/>
  <text x="660" y="133" class="node-text">Inpainting Layers</text>
  <text x="660" y="151" class="node-subtext">Hallucination / Fill</text>

  <!-- Edges to Inpainting Layers -->
  <!-- From Occlusion Mask -->
  <line x1="235" y1="140" x2="583" y2="140" class="edge" marker-end="url(#arrow)"/>

  <!-- From Face Prior -->
  <path d="M 530 84 L 560 84 L 560 126 L 583 126" class="edge" marker-end="url(#arrow)"/>

  <!-- From Source Context -->
  <path d="M 530 196 L 560 196 L 560 154 L 583 154" class="edge" marker-end="url(#arrow)"/>

  <!-- Final Node: Synthesized Output -->
  <rect x="785" y="111" width="175" height="58" class="final-box"/>
  <text x="872.5" y="133" class="node-text">Synthesized Output</text>
  <text x="872.5" y="151" class="node-subtext">Complete Reenacted Frame</text>

  <!-- Edge from Inpainting to Final -->
  <line x1="735" y1="140" x2="783" y2="140" class="edge" marker-end="url(#arrow)"/>
</svg>
